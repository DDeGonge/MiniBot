; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-devkitm-1]
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino

; Enable USB CDC for Serial communication (frees up RX/TX pins, does not work on dev boards)
;
; OTA updates require a "factory + recovery" two-app layout. See partitions.csv
; in the project root. If the espressif32 core doesn't pick the CSV up on its own,
; reflash the layout once before OTA attempts:
;     esptool.py --partition-table=partitions.csv --partition-table-offset=0x8000 partition-table
; After that, esp_ota_get_next_update_partition() returns the recovery slot and
; Update.begin() in ota_updater.cpp stops returning "partition not found".
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
upload_port = COM8
monitor_port = COM8
monitor_speed = 250000
